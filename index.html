<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Task Board</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2m0 10V7m6 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Project Workspace</h1>
        <p class="text-xs text-slate-400">Kelola dan pantau progres tugas harian</p>
      </div>
    </div>
    <button onclick="openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-500/20 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Tambah Tugas
    </button>
  </header>

  <!-- Kanban Board Container -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto h-full items-start">
      
      <!-- Column: To Do -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            <h2 class="font-semibold text-slate-200 text-sm">To Do</h2>
          </div>
          <span id="count-todo" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">0</span>
        </div>
        <div id="todo" class="kanban-col space-y-3 overflow-y-auto flex-1 min-h-[150px] p-1"></div>
      </div>

      <!-- Column: In Progress -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <h2 class="font-semibold text-slate-200 text-sm">In Progress</h2>
          </div>
          <span id="count-in-progress" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">0</span>
        </div>
        <div id="in-progress" class="kanban-col space-y-3 overflow-y-auto flex-1 min-h-[150px] p-1"></div>
      </div>

      <!-- Column: Done -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <h2 class="font-semibold text-slate-200 text-sm">Done</h2>
          </div>
          <span id="count-done" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">0</span>
        </div>
        <div id="done" class="kanban-col space-y-3 overflow-y-auto flex-1 min-h-[150px] p-1"></div>
      </div>

    </div>
  </main>

  <!-- Modal Tambah Tugas -->
  <div id="taskModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Tambah Tugas Baru</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Judul Tugas</label>
          <input type="text" id="taskTitle" required placeholder="Contoh: Selesaikan Desain UI" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Deskripsi</label>
          <textarea id="taskDesc" rows="3" placeholder="Detail tugas..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Prioritas</label>
          <select id="taskPriority" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="low">Rendah</option>
            <option value="medium" selected>Sedang</option>
            <option value="high font-bold">Tinggi</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">Batal</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all">Simpan Tugas</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('kanban_tasks')) || [
      { id: '1', title: 'Integrasi Database Supabase', desc: 'Konfigurasi koneksi tabel absensi.', status: 'todo', priority: 'high' },
      { id: '2', title: 'Desain Layout Portfolio', desc: 'Selesaikan penataan komponen kartu profil.', status: 'in-progress', priority: 'medium' },
      { id: '3', title: 'Setup Tailiwind CSS CDN', desc: 'Tambahkan konfig warna custom.', status: 'done', priority: 'low' }
    ];

    function saveTasks() {
      localStorage.setItem('kanban_tasks', JSON.stringify(tasks));
      renderBoard();
    }

    function renderBoard() {
      const cols = { todo: document.getElementById('todo'), 'in-progress': document.getElementById('in-progress'), done: document.getElementById('done') };
      Object.values(cols).forEach(col => col.innerHTML = '');

      const counts = { todo: 0, 'in-progress': 0, done: 0 };

      tasks.forEach(task => {
        counts[task.status]++;
        const badgeColor = task.priority === 'high' ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : task.priority === 'medium' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-800 text-slate-400 border-slate-700';
        
        const card = document.createElement('div');
        card.className = 'bg-slate-800/80 border border-slate-700/60 p-4 rounded-xl shadow-sm cursor-grab active:cursor-grabbing hover:border-slate-600 transition-all';
        card.draggable = true;
        card.dataset.id = task.id;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <h4 class="font-semibold text-sm text-slate-100">${task.title}</h4>
            <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-rose-400 transition-colors">&times;</button>
          </div>
          <p class="text-xs text-slate-400 mb-3 line-clamp-2">${task.desc || 'Tidak ada deskripsi.'}</p>
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-md border ${badgeColor}">${task.priority}</span>
          </div>
        `;

        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', task.id);
          card.classList.add('opacity-40');
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('opacity-40');
        });

        cols[task.status].appendChild(card);
      });

      document.getElementById('count-todo').textContent = counts.todo;
      document.getElementById('count-in-progress').textContent = counts['in-progress'];
      document.getElementById('count-done').textContent = counts.done;
    }

    // Drag & Drop Handlers
    document.querySelectorAll('.kanban-col').forEach(col => {
      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        col.classList.add('bg-slate-800/30');
      });

      col.addEventListener('dragleave', () => {
        col.classList.remove('bg-slate-800/30');
      });

      col.addEventListener('drop', (e) => {
        e.preventDefault();
        col.classList.remove('bg-slate-800/30');
        const taskId = e.dataTransfer.getData('text/plain');
        const targetStatus = col.id;

        tasks = tasks.map(t => t.id === taskId ? { ...t, status: targetStatus } : t);
        saveTasks();
      });
    });

    // Modal & Form Functions
    function openModal() { document.getElementById('taskModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('taskModal').classList.add('hidden'); }

    function handleAddTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value;
      const desc = document.getElementById('taskDesc').value;
      const priority = document.getElementById('taskPriority').value;

      tasks.push({ id: Date.now().toString(), title, desc, status: 'todo', priority });
      saveTasks();
      closeModal();
      document.getElementById('taskForm').reset();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    // Initial Render
    renderBoard();
  </script>
</body>
</html>
